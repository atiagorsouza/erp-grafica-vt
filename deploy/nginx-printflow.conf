# Exemplo de reverse proxy para PrintFlow ERP
# Ajuste server_name, certificados e upstream conforme o ambiente.

upstream printflow_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.seudominio.com.br;

    # Redireciona para HTTPS em produção
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_pass http://printflow_app;
    }

    location /api/health {
        proxy_pass http://printflow_app;
        access_log off;
    }
}

